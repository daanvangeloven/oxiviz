[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/daanvangeloven/oxiviz"
authors = ["Daan van Geloven"]

[workspace.dependencies]
oxiviz-engine = { path = "crates/engine", version = "1.0.0" }
oxiviz-audio = { path = "crates/audio", version = "1.0.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rustfft = "6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Rendering unoptimized is too slow to try anything out.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
